<po-modal
  #modal
  [p-title]="data?.item ? common().edit : literals().actions.createRole"
  [p-primary-action]="primaryAction()"
  [p-secondary-action]="secondaryAction()"
  (p-close)="close()"
>
  <form [formGroup]="form" class="po-row">
    <div class="po-md-12">
      <po-input name="name" formControlName="name" [p-label]="literals().fields.name" />
    </div>
    <div class="po-md-12">
      <po-textarea
        name="description"
        formControlName="description"
        [p-label]="literals().fields.description"
      />
    </div>
  </form>
</po-modal>
