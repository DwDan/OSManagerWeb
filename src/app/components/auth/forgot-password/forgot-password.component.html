<po-modal
  #modal
  [p-title]="literals().title"
  [p-primary-action]="primaryAction()"
  [p-secondary-action]="secondaryAction()"
  (p-close)="close()"
  [p-hide-close]="loading()"
  [p-click-out]="!loading()"
>
  <form [formGroup]="form">
    <p>
      {{ literals().description }}
    </p>

    <po-email
      name="email"
      [p-label]="literals().emailLabel"
      [p-placeholder]="literals().emailPlaceholder"
      [p-disabled]="emailDisabled()"
      [p-error-pattern]="emailInvalid ? literals().invalidEmail : ''"
      [p-help]="literals().supportMessage + ' ' + literals().supportEmail"
      formControlName="email"
    >
    </po-email>
  </form>
</po-modal>
