<po-modal
  #modal
  [p-title]="literals().modals.edit.title"
  [p-primary-action]="{
    label: common().save,
    action: save.bind(this),
    disabled: saving() || loading(),
  }"
  [p-secondary-action]="{
    label: common().cancel,
    action: cancel.bind(this),
  }"
>
  <form [formGroup]="form" class="po-row">
    <div class="po-md-12">
      <po-input
        name="editClient"
        [p-label]="literals().fields.customer"
        formControlName="name"
      ></po-input>
    </div>

    <div class="po-md-6">
      <po-input
        name="editEmail"
        [p-label]="literals().fields.email"
        formControlName="email"
      ></po-input>
    </div>

    <div class="po-md-6">
      <po-input
        name="editPhone"
        [p-label]="literals().fields.phone"
        p-mask="(99) 99999-9999"
        formControlName="phone"
      ></po-input>
    </div>

    <div class="po-md-4">
      <po-input
        name="editPostalCode"
        [p-label]="literals().fields.postalCode"
        formControlName="postalCode"
      ></po-input>
    </div>

    <div class="po-md-6">
      <po-input
        name="editStreet"
        [p-label]="literals().fields.street"
        formControlName="street"
      ></po-input>
    </div>

    <div class="po-md-2">
      <po-input
        name="editNumber"
        [p-label]="literals().fields.number"
        formControlName="number"
      ></po-input>
    </div>

    <div class="po-md-4">
      <app-state-select formControlName="state"></app-state-select>
    </div>

    <div class="po-md-4">
      <app-city-select [state]="form.controls.state.value" formControlName="city"></app-city-select>
    </div>

    <div class="po-md-4">
      <po-input
        name="editCountry"
        [p-label]="literals().fields.country"
        formControlName="country"
      ></po-input>
    </div>

    <div class="po-md-6">
      <po-input
        name="editComplement"
        [p-label]="literals().fields.complement"
        formControlName="complement"
      ></po-input>
    </div>

    <div class="po-md-6">
      <po-input
        name="editReference"
        [p-label]="literals().fields.reference"
        formControlName="reference"
      ></po-input>
    </div>
  </form>
</po-modal>
