<po-page-default [p-title]="literals().myOrdersTitle" [p-actions]="pageActions()">
  <div class="po-md-12">
    <app-filter-my-order (filterChange)="onFilterChange($event)" />
  </div>

  <div class="po-md-12">
    <app-order-list-view
      [items]="items()"
      [loading]="loading()"
      [columns]="columns()"
      [actions]="tableActions()"
    />
  </div>

  <div class="page-container__pagination">
    <app-pagination
      [page]="page()"
      [pageSize]="pageSize()"
      [totalItems]="totalItems()"
      (pageChange)="onPageChange($event)"
    />
  </div>
</po-page-default>
