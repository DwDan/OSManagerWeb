<po-page-default [p-title]="literals().title">
  @if (cards().length > 0) {
    <div class="po-row">
      @for (card of cards(); track card.key) {
        <div class="po-md-3">
          <po-widget [p-title]="card.title">
            <h2 class="kpi" [class]="card.cssClass">
              {{ card.value }}
            </h2>
          </po-widget>
        </div>
      }
    </div>
  }

  @if (hasChart() || hasLatestOrders()) {
    <div class="po-row po-mt-1">
      @if (hasChart()) {
        <div class="po-md-6">
          <po-widget [p-title]="chartTitle()">
            <po-chart
              [p-type]="chartType"
              [p-categories]="chartCategories()"
              [p-series]="chartSeries()"
            >
            </po-chart>
          </po-widget>
        </div>
      }

      @if (hasLatestOrders()) {
        <div class="po-md-6">
          <po-widget [p-title]="latestOrdersTitle()">
            <po-table
              [p-columns]="columns()"
              [p-items]="items()"
              [p-hide-table-search]="true"
              [p-hide-columns-manager]="true"
              [p-striped]="true"
            >
            </po-table>
          </po-widget>
        </div>
      }
    </div>
  }
</po-page-default>
