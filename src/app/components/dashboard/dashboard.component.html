<po-page-default [p-title]="literals().title">
  <div class="po-row">
    <div class="po-md-3">
      <po-widget [p-title]="literals().widgets.customers">
        <h2 class="kpi">{{ totalCustomers() }}</h2>
      </po-widget>
    </div>

    <div class="po-md-3">
      <po-widget [p-title]="literals().widgets.services">
        <h2 class="kpi">{{ totalServices() }}</h2>
      </po-widget>
    </div>

    <div class="po-md-3">
      <po-widget [p-title]="literals().widgets.activeOrders">
        <h2 class="kpi text-warning">{{ activeOrders() }}</h2>
      </po-widget>
    </div>

    <div class="po-md-3">
      <po-widget [p-title]="literals().widgets.closedOrders">
        <h2 class="kpi text-success">{{ closedOrders() }}</h2>
      </po-widget>
    </div>
  </div>

  <div class="po-row po-mt-1">
    <div class="po-md-6">
      <po-widget [p-title]="literals().widgets.ordersWeek">
        <po-chart
          [p-type]="chartType"
          [p-categories]="chartCategories()"
          [p-series]="chartSeries()"
        >
        </po-chart>
      </po-widget>
    </div>

    <div class="po-md-6">
      <po-widget [p-title]="literals().widgets.latestOrders">
        <po-table
          [p-columns]="columns()"
          [p-items]="items()"
          [p-hide-table-search]="true"
          [p-striped]="true"
        >
        </po-table>
      </po-widget>
    </div>
  </div>
</po-page-default>
