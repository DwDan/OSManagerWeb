<po-modal
  #modal
  [p-title]="literals().modals.evidences.title"
  [p-primary-action]="primaryAction()"
  [p-secondary-action]="secondaryAction()"
  (p-close)="close()"
>
  <div class="po-row">
    <div class="po-md-12">
      <input type="file" multiple (change)="onEvidenceFilesChange($event)" />
    </div>
  </div>
</po-modal>
