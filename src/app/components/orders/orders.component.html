<po-page-default [p-title]="literals().title" [p-actions]="pageActions()">
  <div class="flex flex-col h-95">
    <div class="mb-sm">
      <app-filter-order (filterChange)="onFilterChange($event)" />
    </div>

    <app-order-list-view
      [items]="items()"
      [loading]="loading()"
      [columns]="columns()"
      [actions]="tableActions()"
    />

    <div class="mt-auto mb-md">
      <app-pagination
        [page]="page()"
        [pageSize]="pageSize()"
        [totalItems]="totalItems()"
        (pageChange)="onPageChange($event)"
      />
    </div>
  </div>
</po-page-default>
