<po-page-default [p-title]="literals().title" [p-actions]="pageActions()">
  <po-table
    [p-auto-collapse]="true"
    [p-actions]="tableActions()"
    [p-columns]="columns()"
    [p-hide-columns-manager]="true"
    [p-hide-table-search]="true"
    [p-items]="items()"
    [p-loading]="loading()"
    [p-sort]="true"
    [p-striped]="true"
    [p-spacing]="spacing.Large"
  >
  </po-table>
</po-page-default>
