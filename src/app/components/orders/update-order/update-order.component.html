<po-modal
  #modal
  [p-title]="literals().modals.edit.title"
  [p-primary-action]="{
    label: common().save,
    action: saveEdit.bind(this),
    disabled: loading(),
  }"
  [p-secondary-action]="closeAction"
  (p-close)="closeAction.action()"
>
  <form [formGroup]="form" class="po-row">
    <div class="po-md-12">
      <po-select
        name="editClient"
        [p-label]="literals().fields.customer"
        [p-options]="customers()"
        formControlName="customerId"
      ></po-select>
    </div>

    <div class="po-md-12">
      <po-multiselect
        name="editServices"
        [p-label]="literals().fields.services"
        [p-placeholder]="literals().fields.phServices"
        [p-options]="services()"
        formControlName="services"
      ></po-multiselect>
    </div>

    <div class="po-md-4">
      <po-input
        name="editPostalCode"
        [p-label]="literals().fields.postalCode"
        formControlName="postalCode"
      ></po-input>
    </div>

    <div class="po-md-6">
      <po-input
        name="editStreet"
        [p-label]="literals().fields.street"
        formControlName="street"
      ></po-input>
    </div>

    <div class="po-md-2">
      <po-input
        name="editNumber"
        [p-label]="literals().fields.number"
        formControlName="number"
      ></po-input>
    </div>

    <div class="po-md-4">
      <app-state-select formControlName="state"></app-state-select>
    </div>

    <div class="po-md-4">
      <app-city-select [state]="form.controls.state.value" formControlName="city"></app-city-select>
    </div>

    <div class="po-md-4">
      <po-input
        name="editCountry"
        [p-label]="literals().fields.country"
        formControlName="country"
      ></po-input>
    </div>

    <div class="po-md-6">
      <po-input
        name="editComplement"
        [p-label]="literals().fields.complement"
        formControlName="complement"
      ></po-input>
    </div>

    <div class="po-md-6">
      <po-input
        name="editReference"
        [p-label]="literals().fields.reference"
        formControlName="reference"
      ></po-input>
    </div>
  </form>
</po-modal>
