<po-page-default [p-title]="literals().title" [p-actions]="pageActions()">
  <po-table
    [p-auto-collapse]="true"
    [p-actions]="tableActions()"
    [p-columns]="columns()"
    [p-hide-columns-manager]="true"
    [p-hide-table-search]="false"
    [p-items]="items()"
    [p-loading]="loading()"
    [p-sort]="true"
    [p-striped]="true"
    [p-spacing]="spacing.Large"
  >
  </po-table>
</po-page-default>

<po-modal
  #createUserModal
  [p-title]="literals().modals.create.title"
  [p-primary-action]="saveCreateAction()"
  [p-secondary-action]="cancelCreateAction()"
>
  <div class="po-row">
    <div class="po-md-6">
      <po-input
        name="createFirstName"
        [p-label]="literals().fields.firstName"
        [(ngModel)]="createForm.firstName"
      >
      </po-input>
    </div>

    <div class="po-md-6">
      <po-input
        name="createLastName"
        [p-label]="literals().fields.lastName"
        [(ngModel)]="createForm.lastName"
      >
      </po-input>
    </div>
  </div>

  <div class="po-row">
    <div class="po-md-12">
      <po-input
        name="createEmail"
        [p-label]="literals().fields.email"
        [(ngModel)]="createForm.email"
      >
      </po-input>
    </div>
  </div>

  <div class="po-row">
    <div class="po-md-12">
      <po-password
        name="createPassword"
        [p-label]="literals().fields.password"
        [(ngModel)]="createForm.password"
      >
      </po-password>
    </div>
  </div>
</po-modal>

<po-modal
  #editUserModal
  [p-title]="literals().modals.edit.title"
  [p-primary-action]="saveEditAction()"
  [p-secondary-action]="cancelEditAction()"
>
  <div class="po-row">
    <div class="po-md-6">
      <po-input
        name="firstName"
        [p-label]="literals().fields.firstName"
        [(ngModel)]="editForm.firstName"
      >
      </po-input>
    </div>

    <div class="po-md-6">
      <po-input
        name="lastName"
        [p-label]="literals().fields.lastName"
        [(ngModel)]="editForm.lastName"
      >
      </po-input>
    </div>
  </div>
</po-modal>

<po-modal
  #changeRoleModal
  [p-title]="literals().modals.changeRole.title"
  [p-primary-action]="saveRoleAction()"
  [p-secondary-action]="cancelRoleAction()"
>
  <div class="po-row">
    <div class="po-md-12">
      <po-select
        name="role"
        [p-label]="literals().fields.role"
        [p-options]="roleOptions()"
        [ngModel]="selectedRole"
        (ngModelChange)="selectedRole = $event"
      >
      </po-select>
    </div>
  </div>
</po-modal>
