<po-page-default [p-title]="literals().title" [p-actions]="pageActions()">
  <div class="po-row">
    <div class="po-md-12">
      <app-filter-user (filterChange)="onFilterChange($event)" />
    </div>

    <div class="po-md-12">
      <app-user-list-view
        [items]="items()"
        [loading]="loading()"
        [columns]="columns()"
        [actions]="tableActions()"
      />
    </div>

    <div class="po-md-12">
      <app-pagination
        [page]="page()"
        [pageSize]="pageSize()"
        [totalItems]="totalItems()"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)"
      />
    </div>
  </div>
</po-page-default>
