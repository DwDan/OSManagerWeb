<div class="app-page-header">
  <h2 class="app-page-header__title">
    {{ title }}
  </h2>

  <div class="app-page-header__actions">
    @for (action of resolvedActions(); track action) {
      <po-button
        po-button
        [p-label]="action.label"
        [p-icon]="action.icon!"
        [p-kind]="action.type || 'default'"
        [p-disabled]="action.disabled"
        (click)="action.action?.()"
      ></po-button>
    }
  </div>
</div>
