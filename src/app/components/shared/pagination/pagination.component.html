@if (totalPages() > 0) {
  <div class="app-pagination">
    <div class="app-pagination__page-size-container">
      <label class="app-pagination__page-size-label" for="page-size">
        {{ literals().pageSize }}
      </label>

      <select
        id="page-size"
        class="app-pagination__page-size"
        [value]="pageSize()"
        (change)="onPageSizeChange($event)"
      >
        @for (size of normalizedPageSizeOptions(); track size) {
          <option [value]="size">
            {{ size }}
          </option>
        }
      </select>
    </div>

    <div class="app-pagination__info">
      {{ infoText() }}
    </div>

    <div class="app-pagination__actions">
      <button
        type="button"
        class="app-pagination__nav-button"
        [disabled]="!canGoPrevious()"
        (click)="goToFirstPage()"
      >
        «
      </button>

      <button
        type="button"
        class="app-pagination__nav-button"
        [disabled]="!canGoPrevious()"
        (click)="goToPreviousPage()"
      >
        ‹
      </button>

      @for (item of pages(); track trackByItem($index, item)) {
        @if (item === 'ellipsis') {
          <span class="app-pagination__ellipsis">...</span>
        } @else {
          <button
            type="button"
            class="app-pagination__page-button"
            [class.app-pagination__page-button--active]="item === page()"
            (click)="goToPage(item)"
          >
            {{ item }}
          </button>
        }
      }

      <button
        type="button"
        class="app-pagination__nav-button"
        [disabled]="!canGoNext()"
        (click)="goToNextPage()"
      >
        ›
      </button>

      <button
        type="button"
        class="app-pagination__nav-button"
        [disabled]="!canGoNext()"
        (click)="goToLastPage()"
      >
        »
      </button>
    </div>
  </div>
}
