<po-modal
  #modal
  [p-title]="literals().modals.create.title"
  [p-primary-action]="primaryAction()"
  [p-secondary-action]="secondaryAction()"
  (p-close)="close()"
>
  <form [formGroup]="form" class="po-row">
    <div class="po-md-12">
      <po-input
        name="createClient"
        [p-label]="literals().fields.service"
        formControlName="name"
      ></po-input>
    </div>

    <div class="po-md-6">
      <po-decimal
        name="createAmountToReceive"
        [p-label]="literals().fields.amountToReceive"
        [p-thousand-maxlength]="10"
        [p-decimals-length]="2"
        formControlName="amountToReceive"
      ></po-decimal>
    </div>

    <div class="po-md-6">
      <po-decimal
        name="createAmountToPay"
        [p-label]="literals().fields.amountToPay"
        [p-thousand-maxlength]="10"
        [p-decimals-length]="2"
        formControlName="amountToPay"
      ></po-decimal>
    </div>
  </form>
</po-modal>
